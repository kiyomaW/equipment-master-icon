<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Label</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .label {
    width: 62mm;
    height: 100mm;
    box-sizing: border-box;
    padding-top: 12mm;
    text-align: center;
  }

  .qr {
    width: 38mm;
    height: 38mm;
  }

  .name {
    font-size: 20pt;
    font-weight: bold;
    margin-top: 7mm;
  }

  .line {
    width: 42mm;
    border-top: 1px solid #000;
    margin: 6mm auto 4mm auto;
  }

  .id {
    font-size: 16pt;
    font-weight: bold;
  }

  @media print {
    @page {
      size: 62mm 100mm;
      margin: 0;
    }

    body {
      margin: 0;
    }
  }
</style>
</head>

<body>
  <div class="label">
    <img id="qr" class="qr">

    <div class="name" id="name"></div>

    <div class="line"></div>

    <div class="id" id="eq"></div>
  </div>

<script>
const p = new URLSearchParams(location.search);

const eq = p.get("eq");
const name = p.get("name");
const url = p.get("url");

document.getElementById("eq").textContent = eq;
document.getElementById("name").textContent = name;

document.getElementById("qr").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=" +
  encodeURIComponent(url);

window.onload = function() {
  setTimeout(() => {
    window.print();
  }, 500);
}
</script>
</body>
</html>
